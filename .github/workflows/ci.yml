name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate certification programs
        run: |
          python scripts/validate_certification_program.py --status
          python scripts/validate_witness_registry.py
          python scripts/validate_audience_interface_program.py
          python scripts/validate_formal_artifact_program.py

      - name: Enforce Four Color ontology boundary
        run: python scripts/validate_four_color_ontology.py

      - name: Enforce action-local Four Color control
        run: python scripts/validate_action_local_control.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit and deterministic build tests
        run: pytest

      - name: Four Color Strategy quotient adversarial audit
        if: matrix.python-version == '3.14'
        run: python scripts/report_four_color_strategy_adversaries.py

      - name: Replay deterministic Rocq structural witness
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          python scripts/extract_four_color_structural.py
          find artifacts/witnesses -maxdepth 1 -type f -name 'rocq-*-fourcolor-highlevel*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/rocq-structural-first.sha256
          python scripts/extract_four_color_structural.py
          find artifacts/witnesses -maxdepth 1 -type f -name 'rocq-*-fourcolor-highlevel*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/rocq-structural-second.sha256
          diff -u /tmp/rocq-structural-first.sha256 /tmp/rocq-structural-second.sha256

      - name: Observer-critical collapse witness
        if: matrix.python-version == '3.14'
        run: python tests/observer_critical_witness.py

      - name: Four-stable five-routes witness
        if: matrix.python-version == '3.14'
        run: python tests/fifth_class_witness.py

      - name: Mechanistic interpretability trace witness
        if: matrix.python-version == '3.14'
        run: python tests/interpretability_trace_witness.py

      - name: Provenance fold collapse witness
        if: matrix.python-version == '3.14'
        run: python tests/provenance_fold_witness.py

      - name: Runtime provenance fold witness
        if: matrix.python-version == '3.14'
        run: python tests/runtime_provenance_witness.py

      - name: Traced reducibility witness
        if: matrix.python-version == '3.14'
        run: python tests/reducibility_witness.py

      - name: Blind reduction convergence witness
        if: matrix.python-version == '3.14'
        run: python tests/reduction_convergence_witness.py

      - name: Reducibility admissible-traversal witness
        if: matrix.python-version == '3.14'
        run: python tests/reducibility_gate_witness.py

      - name: Upload observer and interpretability evidence
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observer-interpretability-evidence
          path: |
            artifacts/witnesses/observer-critical-collapse.json
            artifacts/witnesses/four-stable-five-routes.json
            artifacts/witnesses/mechanistic-interpretability-trace.json
            artifacts/witnesses/provenance-fold-collapse.json
            artifacts/witnesses/runtime-provenance-fold.json
            artifacts/witnesses/traced-reducibility.json
            artifacts/witnesses/reduction-convergence.json
            artifacts/witnesses/reducibility-admissible-traversal.json
          if-no-files-found: warn

      - name: Audience witnesses for integrators, operators, and reviewers
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          status=0
          python tests/integrator_contract_witness.py || status=1
          python tests/operator_resilience_witness.py || status=1
          python tests/reviewer_traceability_witness.py || status=1
          exit "${status}"

      - name: Upload Python audience witness evidence
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-audience-witness-evidence
          path: artifacts/witnesses/
          if-no-files-found: warn

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv /tmp/mettafy-wheel-smoke
          /tmp/mettafy-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/mettafy-wheel-smoke/bin/mettafy examples/four_color/solver.py --format json > /tmp/mettafy-smoke.json
          /tmp/mettafy-wheel-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/mettafy-smoke.json').read_text())
          assert isinstance(payload, list)
          assert payload, 'installed CLI returned no strategies for the bootstrap fixture'
          PY

      - name: Audit runtime dependency graph
        if: matrix.python-version == '3.14'
        run: pip-audit .

  hyperon-witness:
    name: Hyperon 0.2.10 state-liveness witness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Hyperon witness environment
        run: python -m pip install --disable-pip-version-check -e '.[dev,hyperon]'

      - name: Run Hyperon rail unit tests
        run: pytest tests/test_hyperon_driver.py tests/test_hyperon_witness.py tests/test_derived_probe.py tests/test_distinction_witness.py

      - name: Run live Hyperon state-liveness witness
        run: python tests/hyperon_liveness_witness.py

      - name: Run source-derived Hyperon liveness witness
        run: python tests/derived_hyperon_liveness_witness.py

      - name: Run source-distinction correspondence witness
        run: python tests/source_distinction_correspondence_witness.py

      - name: Audit Hyperon witness environment
        run: pip-audit

      - name: Upload Hyperon witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyperon-state-liveness-evidence
          path: |
            artifacts/witnesses/hyperon-state-liveness.json
            artifacts/witnesses/derived-hyperon-liveness.json
            artifacts/witnesses/source-distinction-correspondence.json
          if-no-files-found: warn
