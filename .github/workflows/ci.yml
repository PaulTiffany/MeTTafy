name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate certification program
        run: |
          python scripts/validate_certification_program.py --status
          python scripts/validate_witness_registry.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit and deterministic build tests
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv /tmp/mettafy-wheel-smoke
          /tmp/mettafy-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/mettafy-wheel-smoke/bin/mettafy examples/four_color/solver.py --format json > /tmp/mettafy-smoke.json
          /tmp/mettafy-wheel-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/mettafy-smoke.json').read_text())
          assert isinstance(payload, list)
          assert payload, 'installed CLI returned no strategies for the bootstrap fixture'
          PY

      - name: Audit runtime dependency graph
        if: matrix.python-version == '3.14'
        run: pip-audit .
