name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate certification programs
        run: |
          python scripts/validate_certification_program.py --status
          python scripts/validate_witness_registry.py
          python scripts/validate_audience_interface_program.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit and deterministic build tests
        run: pytest

      - name: Replay deterministic Rocq structural witness
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          python scripts/extract_four_color_structural.py
          find artifacts/witnesses -maxdepth 1 -type f -name 'rocq-*-fourcolor-highlevel*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/rocq-structural-first.sha256
          python scripts/extract_four_color_structural.py
          find artifacts/witnesses -maxdepth 1 -type f -name 'rocq-*-fourcolor-highlevel*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/rocq-structural-second.sha256
          diff -u /tmp/rocq-structural-first.sha256 /tmp/rocq-structural-second.sha256

      - name: Audience witnesses for integrators, operators, and reviewers
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          status=0
          python tests/integrator_contract_witness.py || status=1
          python tests/operator_resilience_witness.py || status=1
          python tests/reviewer_traceability_witness.py || status=1
          exit "${status}"

      - name: Upload Python audience witness evidence
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-audience-witness-evidence
          path: artifacts/witnesses/
          if-no-files-found: warn

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv /tmp/mettafy-wheel-smoke
          /tmp/mettafy-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/mettafy-wheel-smoke/bin/mettafy examples/four_color/solver.py --format json > /tmp/mettafy-smoke.json
          /tmp/mettafy-wheel-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/mettafy-smoke.json').read_text())
          assert isinstance(payload, list)
          assert payload, 'installed CLI returned no strategies for the bootstrap fixture'
          PY

      - name: Audit runtime dependency graph
        if: matrix.python-version == '3.14'
        run: pip-audit .
