name: Four Color Formal Witness

on:
  pull_request:
    paths:
      - "certification/formal-artifact-v1.json"
      - "scripts/replay_four_color_proof.sh"
      - ".github/workflows/formal-witness.yml"
  push:
    branches: [main]
    paths:
      - "certification/formal-artifact-v1.json"
      - "scripts/replay_four_color_proof.sh"
      - ".github/workflows/formal-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-color-formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Four Color immutable replay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MeTTafy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Four Color artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rocq-community/fourcolor
          ref: f2fcc837b817632f334f9c7d7fbb0195ad4ba4e2
          path: _vendor/fourcolor
          persist-credentials: false

      - name: Replay proof under immutable checker toolchain
        run: bash scripts/replay_four_color_proof.sh

      - name: Upload formal witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: four-color-formal-witness
          path: |
            artifacts/witnesses/rocq-four-color-replay.json
            artifacts/witnesses/rocq-four-color-replay.log
            artifacts/witnesses/rocq-four-color-packages.txt
          if-no-files-found: error
