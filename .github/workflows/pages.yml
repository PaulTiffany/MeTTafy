name: Pages

on:
  pull_request:
    paths:
      - "certification/**"
      - "exemplars/**"
      - "site/**"
      - "scripts/build_pages.py"
      - "scripts/build_mettascript_grapher.sh"
      - "scripts/fetch_axe_core.sh"
      - "scripts/stamp_site_integrity.py"
      - "tests/accessibility_witness.py"
      - "tests/browser_smoke.py"
      - "tests/differential_execution_witness.mjs"
      - "tests/human_interface_witness.py"
      - "tests/metta_runtime_witness.mjs"
      - "tests/site_size_witness.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "certification/**"
      - "exemplars/**"
      - "site/**"
      - "scripts/build_pages.py"
      - "scripts/build_mettascript_grapher.sh"
      - "scripts/fetch_axe_core.sh"
      - "scripts/stamp_site_integrity.py"
      - "tests/accessibility_witness.py"
      - "tests/browser_smoke.py"
      - "tests/differential_execution_witness.mjs"
      - "tests/human_interface_witness.py"
      - "tests/metta_runtime_witness.mjs"
      - "tests/site_size_witness.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MeTTafy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout MeTTaScript 3.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MesTTo/MeTTaScript
          ref: abe13439196bccdb48b6636773a46ec9772a7aaf
          path: _vendor/MeTTaScript
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build verified MeTTaScript Grapher
        run: bash scripts/build_mettascript_grapher.sh

      - name: Fetch verified axe-core witness engine
        run: bash scripts/fetch_axe_core.sh

      - name: Install browser smoke dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Build static site
        run: |
          python scripts/build_pages.py
          python scripts/stamp_site_integrity.py

      - name: Verify deterministic rebuild
        run: |
          find _site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/site-first.sha256
          python scripts/build_pages.py
          python scripts/stamp_site_integrity.py
          find _site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/site-second.sha256
          diff -u /tmp/site-first.sha256 /tmp/site-second.sha256

      - name: Static site resource witness
        run: python tests/site_size_witness.py

      - name: MeTTa ecosystem runtime witness
        run: node tests/metta_runtime_witness.mjs

      - name: Differential source to MeTTa execution witness
        run: node tests/differential_execution_witness.mjs

      - name: Browser, accessibility, and human operability witnesses
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/mettafy-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid}' EXIT
          python tests/browser_smoke.py
          python tests/accessibility_witness.py
          python tests/human_interface_witness.py

      - name: Upload witness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mechanical-witness-evidence
          path: artifacts/witnesses/
          if-no-files-found: warn

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
