name: Pages

on:
  pull_request:
    paths:
      - "exemplars/**"
      - "site/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "exemplars/**"
      - "site/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MeTTafy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout MeTTaScript 3.4.0
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: MesTTo/MeTTaScript
          ref: abe13439196bccdb48b6636773a46ec9772a7aaf
          path: _vendor/MeTTaScript
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 22

      - name: Build MeTTaScript Grapher
        working-directory: _vendor/MeTTaScript
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @mettascript/grapher build

      - name: Build static site
        run: python3 scripts/build_pages.py

      - name: Verify deterministic rebuild
        run: |
          find _site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/site-first.sha256
          python3 scripts/build_pages.py
          find _site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/site-second.sha256
          diff -u /tmp/site-first.sha256 /tmp/site-second.sha256

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
