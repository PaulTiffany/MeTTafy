[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mettafy"
version = "0.0.1"
description = "Semantic decompilation into executable MeTTa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Paul Carver Tiffany III" }
]
keywords = ["metta", "hyperon", "program-analysis", "semantic-decompilation", "neurosymbolic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
]

dependencies = []

[project.optional-dependencies]
hyperon = [
  "hyperon==0.2.10",
]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "playwright==1.61.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
  "twine==6.2.0",
]

[project.scripts]
mettafy = "mettafy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mettafy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_vendor", "_site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/mettafy",
  "scripts/build_pages.py",
  "scripts/extract_four_color_structural.py",
  "scripts/validate_certification_program.py",
  "scripts/validate_audience_interface_program.py",
  "scripts/validate_formal_artifact_program.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["^_vendor/", "^_site/"]

[[tool.mypy.overrides]]
module = ["hyperon", "hyperon.*"]
ignore_missing_imports = true
