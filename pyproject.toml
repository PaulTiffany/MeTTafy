[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mettafy"
version = "0.0.1"
description = "Semantic decompilation into executable MeTTa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Paul Carver Tiffany III" }
]
keywords = ["metta", "hyperon", "program-analysis", "semantic-decompilation", "neurosymbolic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Compilers",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
mettafy = "mettafy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mettafy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
